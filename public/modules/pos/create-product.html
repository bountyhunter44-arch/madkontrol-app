<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Opret produkt - Madkontrollen POS</title>
  <style>
    :root {
      --bg: #f3f7f1;
      --surface: #ffffff;
      --surface-soft: #eef5eb;
      --text: #17311f;
      --muted: #667466;
      --border: #dbe7d7;
      --green: #236a3a;
      --green-dark: #164929;
      --danger: #b42318;
      --shadow: 0 16px 36px rgba(26, 54, 35, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .brand {
      display: grid;
      gap: 2px;
    }

    .brand strong {
      font-size: 18px;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav a,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--green-dark);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      padding: 9px 13px;
    }

    .btn.primary,
    .nav a[aria-current="page"] {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 36px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 18px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    h1,
    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
    }

    .status {
      min-height: 20px;
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .status.error {
      color: var(--danger);
    }

    .product-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .product-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .product-row strong {
      display: block;
    }

    .product-row span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .image-panel {
      display: grid;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      padding: 12px;
    }

    .image-preview {
      display: grid;
      place-items: center;
      width: 140px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      color: var(--green);
      font-size: 34px;
      font-weight: 950;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    details.advanced-image {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Opret produkt</strong>
      <span>Madkontrollen POS</span>
    </div>
    <nav class="nav" aria-label="POS navigation">
      <a href="./index.html">Kasse</a>
      <a href="./create-product.html" aria-current="page">Opret produkt</a>
      <a href="./edit-product.html">Ret vare</a>
      <a href="./delete-product.html">Slet produkter</a>
      <a href="./sales-report.html">Salgsrapport</a>
    </nav>
  </header>

  <main>
    <section class="grid">
      <form class="panel form" id="product-form">
        <h1>Nyt produkt</h1>
        <label>
          Produktnavn
          <input id="product-name" type="text" autocomplete="off" placeholder="Fx Dagens ret" required>
        </label>
        <label>
          Pris inkl. moms
          <input id="product-price" type="number" min="0" step="0.01" placeholder="Fx 89" required>
        </label>
        <label>
          Kategori
          <select id="product-category">
            <option value="Mad">Mad</option>
            <option value="Drikke">Drikke</option>
            <option value="Tilbehør">Tilbehør</option>
            <option value="Dessert">Dessert</option>
            <option value="Andet">Andet</option>
          </select>
        </label>
        <section class="image-panel" aria-label="Billede">
          <strong>Billede</strong>
          <div id="image-preview" class="image-preview" aria-live="polite">?</div>
          <p class="status" id="image-status">Billeder gemmes i Cloudinary.</p>
          <div class="image-actions">
            <button class="btn" type="button" id="generate-image-button">Generér billede</button>
            <button class="btn" type="button" id="upload-image-button">Upload billede</button>
            <button class="btn" type="button" id="select-cloudinary-button">Vælg eksisterende</button>
            <button class="btn" type="button" id="remove-image-button">Fjern billede</button>
          </div>
          <input id="product-image-file" type="file" accept="image/*" hidden>
          <details class="advanced-image">
            <summary>Avanceret</summary>
            <label>
              Ekstern billed-URL (fallback)
              <input id="product-image-url" type="url" autocomplete="off" placeholder="https://res.cloudinary.com/...">
            </label>
          </details>
        </section>
        <button class="btn primary" type="submit">Gem produkt</button>
        <p class="status" id="status" role="status"></p>
      </form>

      <aside class="panel">
        <h2>Produkter</h2>
        <div id="product-list" class="product-list"></div>
      </aside>
    </section>
  </main>

  <script type="module">
    import app from "./firebase-config.js";
    import { createPosStore } from "./pos-store.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

    const functions = getFunctions(app, "us-central1");
    window.POS_IMAGE_API = {
      generateProductImage: httpsCallable(functions, "generatePosProductImage"),
      getCloudinarySignature: httpsCallable(functions, "getCloudinarySignature")
    };

    window.POS_STORE_READY = createPosStore({ sourceApp: "pos" })
      .then((store) => {
        window.POS_STORE = store;
        window.dispatchEvent(new CustomEvent("pos:store-ready", { detail: store }));
        return store;
      })
      .catch((error) => {
        console.warn("[pos] Firestore store fallback", error);
        window.dispatchEvent(new CustomEvent("pos:store-ready", { detail: null }));
        return null;
      });
  </script>

  <script>
    let posStore = null;
    let products = [];
    let currentImage = null;
    let savedProductId = "";

    function requireCloudStore() {
      if (!posStore?.cloudEnabled) {
        throw new Error("POS er ikke koblet til en virksomhed endnu.");
      }
      return posStore;
    }

    async function refreshProducts() {
      try {
        const store = posStore || await window.POS_STORE_READY;
        products = store?.cloudEnabled ? await store.listProducts() : [];
      } catch (error) {
        console.warn("[pos] Produktliste fra Firestore fejlede", error);
        products = [];
      }
      renderProducts();
    }

    function renderProducts() {
      const list = document.getElementById("product-list");
      if (!products.length) {
        list.innerHTML = '<p class="status">Ingen produkter endnu.</p>';
        return;
      }

      list.innerHTML = products
        .slice()
        .sort((a, b) => String(a.name).localeCompare(String(b.name), "da-DK"))
        .map((product) => `
          <article class="product-row">
            <strong>${escapeHtml(product.name)}</strong>
            <span>${escapeHtml(product.category || "Andet")} · ${Number(product.price).toFixed(2)} kr.</span>
          </article>
        `)
        .join("");
    }

    function productInitial() {
      return (document.getElementById("product-name").value.trim().charAt(0) || "?").toUpperCase();
    }

    function cloudinaryThumbFromUrl(url) {
      return String(url || "").includes("/image/upload/")
        ? String(url).replace("/image/upload/", "/image/upload/f_auto,q_auto,c_fill,g_auto,w_400,h_400/")
        : String(url || "");
    }

    function buildImageFromUpload(uploadData, source = "uploaded") {
      const secureUrl = String(uploadData.secure_url || uploadData.secureUrl || "");
      const publicId = String(uploadData.public_id || uploadData.publicId || uploadData.cloudinaryPublicId || "");
      const isCloudinary = /^https:\/\/res\.cloudinary\.com\//i.test(secureUrl) || Boolean(publicId);
      return {
        provider: isCloudinary ? "cloudinary" : "external",
        cloudinaryPublicId: publicId,
        secureUrl,
        thumbnailUrl: cloudinaryThumbFromUrl(secureUrl),
        width: Number(uploadData.width || 0) || null,
        height: Number(uploadData.height || 0) || null,
        format: String(uploadData.format || ""),
        alt: document.getElementById("product-name").value.trim(),
        source,
        prompt: uploadData.prompt || "",
        generatedAt: uploadData.generatedAt || "",
        updatedAt: new Date().toISOString()
      };
    }

    function renderImagePreview() {
      const preview = document.getElementById("image-preview");
      const src = currentImage?.thumbnailUrl || currentImage?.secureUrl || document.getElementById("product-image-url").value.trim();
      if (src) {
        preview.innerHTML = `<img src="${escapeHtml(src)}" alt="${escapeHtml(currentImage?.alt || "Produktbillede")}">`;
      } else {
        preview.textContent = productInitial();
      }
    }

    function setImageStatus(message, isError = false) {
      const status = document.getElementById("image-status");
      status.textContent = message;
      status.className = isError ? "status error" : "status";
    }

    function getProductPayload() {
      const name = document.getElementById("product-name").value.trim();
      const price = parseFloat(document.getElementById("product-price").value);
      const category = document.getElementById("product-category").value || "Andet";
      const fallbackUrl = document.getElementById("product-image-url").value.trim();
      const fallbackImage = fallbackUrl ? buildImageFromUpload({ secure_url: fallbackUrl }, "selected") : null;
      const image = currentImage || fallbackImage;
      return {
        name,
        price,
        priceIncVat: price,
        category,
        image,
        imageUrl: image?.secureUrl || "",
        imageAlt: image?.alt || name,
        active: true
      };
    }

    async function saveCurrentProduct({ stayOnForm = false } = {}) {
      const status = document.getElementById("status");
      const payload = getProductPayload();
      if (!payload.name || Number.isNaN(payload.price) || payload.price < 0) {
        status.textContent = "Angiv et gyldigt produktnavn og en gyldig pris.";
        status.className = "status error";
        throw new Error(status.textContent);
      }
      const store = posStore || await window.POS_STORE_READY;
      if (store) posStore = store;
      requireCloudStore();
      if (savedProductId) {
        await store.updateProduct(savedProductId, payload);
      } else {
        const created = await store.createProduct(payload);
        savedProductId = String(created.id || created.productId);
      }
      products = await store.listProducts();
      renderProducts();
      if (!stayOnForm) resetProductForm();
      return { store, productId: savedProductId, payload };
    }

    function resetProductForm() {
      document.getElementById("product-name").value = "";
      document.getElementById("product-price").value = "";
      document.getElementById("product-category").value = "Mad";
      document.getElementById("product-image-url").value = "";
      currentImage = null;
      savedProductId = "";
      renderImagePreview();
      document.getElementById("product-name").focus();
    }

    async function generateProductImage() {
      try {
        setImageStatus("Genererer billede...");
        const { store, productId, payload } = await saveCurrentProduct({ stayOnForm: true });
        if (!store?.cloudEnabled) {
          throw new Error("Virksomhedsoplysninger mangler. Gå til onboarding for bedre billeder.");
        }
        const response = await window.POS_IMAGE_API.generateProductImage({
          companyId: store.context.companyId,
          locationId: store.context.locationId,
          productId,
          productName: payload.name,
          category: payload.category
        });
        currentImage = response.data?.image || null;
        products = await store.listProducts();
        renderProducts();
        renderImagePreview();
        setImageStatus("Billedet er genereret og gemt i Cloudinary.");
      } catch (error) {
        setImageStatus(error.message || "Billedet kunne ikke genereres.", true);
      }
    }

    async function uploadProductImage(file) {
      if (!file) return;
      try {
        setImageStatus("Uploader billede til Cloudinary...");
        const { store, productId } = await saveCurrentProduct({ stayOnForm: true });
        if (!store?.cloudEnabled) throw new Error("Virksomhedsoplysninger mangler. Gå til onboarding for bedre billeder.");
        const signature = await window.POS_IMAGE_API.getCloudinarySignature({
          companyId: store.context.companyId,
          locationId: store.context.locationId,
          moduleType: "pos_products",
          itemId: productId
        });
        const sig = signature.data || {};
        const formData = new FormData();
        formData.append("file", file);
        formData.append("api_key", sig.apiKey);
        formData.append("timestamp", sig.timestamp);
        formData.append("signature", sig.signature);
        formData.append("folder", sig.folder);
        formData.append("public_id", sig.publicId);
        formData.append("tags", sig.tags);
        formData.append("context", sig.context);
        const uploadResp = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(sig.cloudName)}/image/upload`, {
          method: "POST",
          body: formData
        });
        if (!uploadResp.ok) throw new Error(await uploadResp.text());
        const uploadData = await uploadResp.json();
        currentImage = buildImageFromUpload(uploadData, "uploaded");
        await store.updateProduct(productId, {
          image: currentImage,
          imageUrl: currentImage.secureUrl,
          imageAlt: currentImage.alt
        });
        products = await store.listProducts();
        renderProducts();
        renderImagePreview();
        setImageStatus("Billedet er uploadet og gemt i Cloudinary.");
      } catch (error) {
        setImageStatus(error.message || "Billedet kunne ikke uploades.", true);
      }
    }

    async function selectExistingCloudinaryImage() {
      const secureUrl = prompt("Indsæt Cloudinary secure URL:");
      if (!secureUrl) return;
      if (!/^https:\/\/res\.cloudinary\.com\//i.test(secureUrl.trim())) {
        setImageStatus("Vælg et Cloudinary-billede fra res.cloudinary.com.", true);
        return;
      }
      const publicId = prompt("Indsæt Cloudinary public ID:", "") || "";
      currentImage = buildImageFromUpload({ secure_url: secureUrl.trim(), public_id: publicId.trim() }, "selected");
      renderImagePreview();
      setImageStatus("Cloudinary-billedet er valgt. Gem produktet for at bruge det.");
    }

    document.getElementById("product-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.getElementById("status");
      const payload = getProductPayload();
      const duplicate = products.some((product) => !savedProductId && product.name.trim().toLowerCase() === payload.name.toLowerCase());
      if (duplicate && !confirm("Der findes allerede et produkt med det navn. Vil du oprette det alligevel?")) {
        return;
      }

      try {
        const { store } = await saveCurrentProduct();
        status.textContent = "Produktet er oprettet i Firestore.";
        status.className = "status";
      } catch (error) {
        status.textContent = error.message || "Produktet kunne ikke gemmes.";
        status.className = "status error";
      }
    });

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.addEventListener("pos:store-ready", async (event) => {
      posStore = event.detail || null;
      await refreshProducts();
    });

    document.getElementById("product-name").addEventListener("input", renderImagePreview);
    document.getElementById("product-image-url").addEventListener("input", renderImagePreview);
    document.getElementById("generate-image-button").addEventListener("click", generateProductImage);
    document.getElementById("upload-image-button").addEventListener("click", () => document.getElementById("product-image-file").click());
    document.getElementById("product-image-file").addEventListener("change", (event) => uploadProductImage(event.target.files?.[0]));
    document.getElementById("select-cloudinary-button").addEventListener("click", selectExistingCloudinaryImage);
    document.getElementById("remove-image-button").addEventListener("click", () => {
      currentImage = null;
      document.getElementById("product-image-url").value = "";
      renderImagePreview();
      setImageStatus("Billedet er fjernet fra denne vare. Gem produktet for at gemme ændringen.");
    });

    renderImagePreview();
    renderProducts();
    refreshProducts();
  </script>
</body>
</html>
