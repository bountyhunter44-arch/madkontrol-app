<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slet produkter - Madkontrollen POS</title>
  <style>
    :root {
      --bg: #f3f7f1;
      --surface: #ffffff;
      --surface-soft: #eef5eb;
      --text: #17311f;
      --muted: #667466;
      --border: #dbe7d7;
      --green: #236a3a;
      --green-dark: #164929;
      --danger: #b42318;
      --danger-soft: #fff0ee;
      --shadow: 0 16px 36px rgba(26, 54, 35, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .brand {
      display: grid;
      gap: 2px;
    }

    .brand strong {
      font-size: 18px;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav a,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--green-dark);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      padding: 9px 13px;
    }

    .nav a[aria-current="page"] {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    .btn.danger {
      border-color: #f1c3bf;
      background: var(--danger-soft);
      color: var(--danger);
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 36px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    .toolbar input {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--text);
    }

    .product-list {
      display: grid;
      gap: 10px;
    }

    .product-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .product-row strong {
      display: block;
      line-height: 1.25;
    }

    .product-row span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav {
        justify-content: flex-start;
      }

      .toolbar,
      .product-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Slet produkter</strong>
      <span>Madkontrollen POS</span>
    </div>
    <nav class="nav" aria-label="POS navigation">
      <a href="/modules/pos/index.html">Kasse</a>
      <a href="/modules/pos/create-product.html">Opret produkt</a>
      <a href="/modules/pos/edit-product.html">Ret vare</a>
      <a href="/modules/pos/delete-product.html" aria-current="page">Slet produkter</a>
      <a href="/modules/pos/sales-report.html">Salgsrapport</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h1>Produktliste</h1>
      <div class="toolbar">
        <input id="search" type="search" autocomplete="off" placeholder="Søg efter produkt">
        <button class="btn danger" type="button" id="delete-all">Slet alle</button>
      </div>
      <div id="product-list" class="product-list"></div>
      <p class="status" id="status" role="status"></p>
    </section>
  </main>

  <script type="module">
    import { createPosStore } from "/modules/pos/pos-store.js";

    window.POS_STORE_READY = createPosStore({ sourceApp: "pos" })
      .then((store) => {
        window.POS_STORE = store;
        window.dispatchEvent(new CustomEvent("pos:store-ready", { detail: store }));
        return store;
      })
      .catch((error) => {
        console.warn("[pos] Firestore store fallback", error);
        window.dispatchEvent(new CustomEvent("pos:store-ready", { detail: null }));
        return null;
      });
  </script>

  <script>
    let posStore = null;
    let products = [];

    function requireCloudStore() {
      if (!posStore?.cloudEnabled) {
        throw new Error("POS er ikke koblet til en virksomhed endnu.");
      }
      return posStore;
    }

    async function refreshProducts() {
      try {
        const store = posStore || await window.POS_STORE_READY;
        products = store?.cloudEnabled ? await store.listProducts() : [];
      } catch (error) {
        console.warn("[pos] Produktliste fra Firestore fejlede", error);
        products = [];
      }
      renderProducts();
    }

    function renderProducts() {
      const list = document.getElementById("product-list");
      const query = document.getElementById("search").value.trim().toLowerCase();
      const visibleProducts = products.filter((product) => product.name.toLowerCase().includes(query));

      if (!visibleProducts.length) {
        list.innerHTML = '<p class="status">Ingen produkter matcher søgningen.</p>';
        return;
      }

      list.innerHTML = visibleProducts
        .slice()
        .sort((a, b) => String(a.name).localeCompare(String(b.name), "da-DK"))
        .map((product) => `
          <article class="product-row">
            <strong>${escapeHtml(product.name)}</strong>
            <span>${Number(product.price).toFixed(2)} kr.</span>
            <button class="btn danger" type="button" onclick="deleteProduct(${JSON.stringify(String(product.id))})">Slet</button>
          </article>
        `)
        .join("");
    }

    async function deleteProduct(id) {
      const product = products.find((item) => String(item.id) === String(id));
      if (!product) return;

      if (!confirm(`Slet produktet "${product.name}"?`)) return;

      try {
        const store = posStore || await window.POS_STORE_READY;
        posStore = store;
        requireCloudStore();
        await store.deleteProduct(id);
        products = await store.listProducts();
        renderProducts();
        setStatus("Produktet er markeret som slettet i Firestore.");
      } catch (error) {
        setStatus(error.message || "Produktet kunne ikke slettes.");
      }
    }

    document.getElementById("search").addEventListener("input", renderProducts);

    document.getElementById("delete-all").addEventListener("click", async () => {
      if (!products.length) {
        setStatus("Der er ingen produkter at slette.");
        return;
      }

      if (!confirm("Er du sikker på, at alle POS-produkter skal slettes?")) return;

      try {
        const store = posStore || await window.POS_STORE_READY;
        posStore = store;
        requireCloudStore();
        await Promise.all(products.map((product) => store.deleteProduct(product.id)));
        products = await store.listProducts();
        renderProducts();
        setStatus("Alle produkter er markeret som slettet i Firestore.");
      } catch (error) {
        setStatus(error.message || "Produkterne kunne ikke slettes.");
      }
    });

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.addEventListener("pos:store-ready", async (event) => {
      posStore = event.detail || null;
      await refreshProducts();
    });
    window.deleteProduct = deleteProduct;
    renderProducts();
    refreshProducts();
  </script>
</body>
</html>
